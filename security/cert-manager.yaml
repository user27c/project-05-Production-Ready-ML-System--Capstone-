#    helm install cert-manager jetstack/cert-manager \
#      --namespace cert-manager \
#      --create-namespace \
#      --set installCRDs=true \
#      --version v1.13.0
#
# 2. 验证 cert-manager 安装：
#    kubectl get pods -n cert-manager
#    kubectl get crds | grep cert-manager
#
# 3. 更新上面 ClusterIssuer 中的电子邮件地址
#
# 4. 应用 ClusterIssuer：
#    kubectl apply -f security/cert-manager.yaml
#
# 5. 验证 ClusterIssuer 就绪：
#    kubectl get clusterissuer
#    kubectl describe clusterissuer letsencrypt-staging
#
# 6. 首先使用 staging 进行测试：
#    - 部署到 staging 环境
#    - 验证证书已颁发
#    - 检查证书详情
#
# 7. 检查证书状态：
#    kubectl get certificate -n ml-system-staging
#    kubectl describe certificate staging-tls -n ml-system-staging
#
# 8. 检查证书是否就绪：
#    kubectl wait --for=condition=Ready certificate/staging-tls \
#      -n ml-system-staging --timeout=5m
#
# 9. 查看证书详情：
#    kubectl get secret staging-tls -n ml-system-staging -o yaml
#
# 10. 测试 HTTPS 端点：
#     curl -v https://staging.example.com/health
#     # 应该显示有效的 TLS 连接
#
# 11. 部署到生产环境：
#     - staging 验证成功后，使用生产环境 ClusterIssuer
#     - 更新 Ingress 使用 letsencrypt-prod
#     - 监控证书颁发情况
#
# TODO: 故障排除：
#
# 1. 证书未颁发：
#    kubectl describe certificate <name> -n <namespace>
#    kubectl describe certificaterequest <name> -n <namespace>
#    kubectl describe order <name> -n <namespace>
#    kubectl describe challenge <name> -n <namespace>
#
# 2. 检查 cert-manager 日志：
#    kubectl logs -n cert-manager deploy/cert-manager -f
#
# 3. 常见问题：
#    - DNS 未指向 LoadBalancer IP
#    - 防火墙阻止 HTTP-01 挑战（端口 80）
#    - 达到速率限制（请先使用 staging！）
#    - 电子邮件地址无效
#
