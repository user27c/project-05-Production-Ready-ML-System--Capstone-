# cert-manager TLS 证书管理配置
# ========================================================
# 本文件配置 cert-manager 以使用 Let's Encrypt 自动为 ML API
# 配置和续期 TLS 证书。

# TODO: 首先安装 cert-manager：
# helm repo add jetstack https://charts.jetstack.io
# helm repo update
# helm install cert-manager jetstack/cert-manager \
#   --namespace cert-manager \
#   --create-namespace \
#   --set installCRDs=true

---
# Let's Encrypt Staging 的 ClusterIssuer
# 用于测试以避免速率限制
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # TODO: 设置您的电子邮件地址以接收 Let's Encrypt 通知
    email: your-email@example.com

    # Let's Encrypt staging 服务器（用于测试）
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    # TODO: 创建用于存储 ACME 账户私钥的密钥
    privateKeySecretRef:
      name: letsencrypt-staging

    # TODO: 配置 HTTP-01 挑战解决器
    solvers:
      - http01:
          ingress:
            class: nginx

---
# Let's Encrypt Production 的 ClusterIssuer
# 在使用 staging 测试完成后用于生产环境
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # TODO: 设置您的电子邮件地址
    email: your-email@example.com

    # Let's Encrypt 生产服务器
    # 警告：存在速率限制（每个域名每周 50 个证书）
    server: https://acme-v02.api.letsencrypt.org/directory

    # TODO: 创建用于存储 ACME 账户私钥的密钥
    privateKeySecretRef:
      name: letsencrypt-prod

    # TODO: 配置 HTTP-01 或 DNS-01 挑战解决器
    solvers:
      # HTTP-01 挑战（更简单，适用于大多数情况）
      - http01:
          ingress:
            class: nginx

      # TODO: DNS-01 挑战（通配符证书需要）
      # 如果需要通配符证书，请取消注释并配置
      # - dns01:
      #     cloudDNS:  # 用于 Google Cloud DNS
      #       project: your-gcp-project
      #       serviceAccountSecretRef:
      #         name: clouddns-dns01-solver-sa
      #         key: key.json
      #
      # 或用于 AWS Route53：
      # - dns01:
      #     route53:
      #       region: us-east-1
      #       accessKeyID: YOUR_ACCESS_KEY_ID
      #       secretAccessKeySecretRef:
      #         name: route53-credentials
      #         key: secret-access-key

---
# Certificate 资源示例（Staging）
# 可以通过 Ingress 注解自动创建，
# 也可以像这样手动创建以获得更多控制
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: staging-tls
  namespace: ml-system-staging
spec:
  # TODO: 设置您的 staging 域名
  dnsNames:
    - staging.example.com

  # TODO: 存储证书的密钥名称
  secretName: staging-tls

  # TODO: 引用 ClusterIssuer
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer

  # 可选：配置证书续期
  renewBefore: 360h  # 在过期前 15 天续期

  # 可选：配置私钥
  privateKey:
    algorithm: RSA
    size: 2048

---
# Certificate 资源示例（Production）
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: production-tls
  namespace: ml-system-production
spec:
  # TODO: 设置您的生产域名
  dnsNames:
    - api.example.com
    # 如有需要，添加其他域名：
    # - www.example.com

  # TODO: 存储证书的密钥名称
  secretName: production-tls

  # TODO: 引用生产环境 ClusterIssuer
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

  # 在过期前 15 天续期
  renewBefore: 360h

  # 使用强私钥
  privateKey:
    algorithm: RSA
    size: 4096

---
#带有 cert-manager 注解的 Ingress 示例
# 这会自动创建一个 Certificate 资源
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-api-ingress
  namespace: ml-system-production
  annotations:
    # TODO: 添加 cert-manager 注解以自动创建证书
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # TODO: 添加 NGINX 特定注解
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

    # TODO: 添加安全头
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";

    # TODO: 添加限流
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  ingressClassName: nginx
  tls:
    # TODO: 配置 TLS
    - hosts:
        - api.example.com
      secretName: production-tls
  rules:
    # TODO: 配置路由规则
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-api
                port:
                  number: 80

