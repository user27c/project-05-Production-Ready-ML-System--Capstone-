#
# - cert-manager 会自动续期证书
# - 默认在过期前 30 天开始续期
# - 可配置 renewBefore 自定义续期时间
# - 在 cert-manager 日志中监控续期情况
#
# TODO: 安全最佳实践：
#
# 1. 使用强 TLS 协议（TLS 1.2+，优先使用 TLS 1.3）
# 2. 使用强密码套件
# 3. 启用 HSTS 头
# 4. 将 HTTP 重定向到 HTTPS
# 5. 监控证书过期时间
# 6. 为续期失败设置告警
# 7. 在 staging 中测试证书续期
# 8. 保持 cert-manager 更新
