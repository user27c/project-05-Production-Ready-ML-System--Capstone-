# HashiCorp Vault 配置（可选但推荐）
# =========================================================
# 本文件展示如何集成 HashiCorp Vault 进行密钥管理。
# Vault 提供动态密钥、加密即服务和审计日志功能。

# 注意：这是一个高级主题。对于简单的项目，使用带有 SealedSecrets 的
# Kubernetes Secrets 就足够了。为需要企业级密钥管理的生产系统实施 Vault。

---
# TODO: 使用 Helm 安装 Vault
# helm repo add hashicorp https://helm.releases.hashicorp.com
# helm repo update
# helm install vault hashicorp/vault \
#   --namespace vault \
#   --create-namespace \
#   --values vault-values.yaml

# vault-values.yaml 示例：
# server:
#   ha:
#     enabled: true
#     replicas: 3
#   dataStorage:
#     enabled: true
#     size: 10Gi
#   auditStorage:
#     enabled: true
#     size: 10Gi

---
# ml-api 与 Vault 进行身份验证的 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-api-vault-auth
  namespace: ml-system-production

---
# CSI Driver 的 SecretProviderClass（推荐方法）
# 使用 Secrets Store CSI Driver 挂载 Vault 密钥
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-ml-api-secrets
  namespace: ml-system-production
spec:
  provider: vault
  parameters:
    # TODO: 配置 Vault 地址
    vaultAddress: "http://vault.vault:8200"

    # TODO: 配置 Vault 角色
    roleName: "ml-api-role"

    # TODO: 定义要从 Vault 获取的密钥
    objects: |
      - objectName: "api-key"
        secretPath: "secret/data/ml-api/production"
        secretKey: "api_key"
      - objectName: "mlflow-password"
        secretPath: "secret/data/ml-api/production"
        secretKey: "mlflow_password"
      - objectName: "db-password"
        secretPath: "secret/data/ml-api/production"
        secretKey: "db_password"

  # TODO: 同步密钥到 Kubernetes Secret（可选）
  secretObjects:
    - secretName: ml-api-secrets
      type: Opaque
      data:
        - objectName: api-key
          key: API_KEY
        - objectName: mlflow-password
          key: MLFLOW_PASSWORD
        - objectName: db-password
          key: DB_PASSWORD

---
# 使用 Vault CSI Driver 挂载 Vault 密钥的 Deployment 示例
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api-deployment-vault-example
  namespace: ml-system-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
    spec:
      serviceAccountName: ml-api-vault-auth

      # TODO: 添加密钥存储卷
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: vault-ml-api-secrets

      containers:
        - name: ml-api
          image: ghcr.io/your-org/ml-api:v1.0.0

          # TODO: 挂载密钥存储卷
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true

          # TODO: 通过环境变量引用密钥
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: ml-api-secrets
                  key: API_KEY
            - name: MLFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ml-api-secrets
                  key: MLFLOW_PASSWORD

