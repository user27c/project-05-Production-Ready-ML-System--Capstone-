# ==============================================================================
# 替代方案：Vault Agent Sidecar 注入
# ==============================================================================

# 除了 CSI Driver，您还可以使用 Vault Agent sidecar
# 这会自动注入一个 Vault Agent 容器

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api-deployment-vault-agent-example
  namespace: ml-system-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
      annotations:
        # TODO: 启用 Vault Agent 注入
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ml-api-role"

        # TODO: 注入特定密钥
        vault.hashicorp.com/agent-inject-secret-api-key: "secret/data/ml-api/production"
        vault.hashicorp.com/agent-inject-template-api-key: |
          {{- with secret "secret/data/ml-api/production" -}}
          export API_KEY="{{ .Data.data.api_key }}"
          {{- end }}

    spec:
      serviceAccountName: ml-api-vault-auth
      containers:
        - name: ml-api
          image: ghcr.io/your-org/ml-api:v1.0.0
          # 密钥将位于 /vault/secrets/

# ==============================================================================
# 学生实施说明
# ==============================================================================

# Vault 是一个高级主题。在以下情况下实施：
# - 您需要企业级密钥管理
# - 您有合规要求（SOC 2、HIPAA）
# - 您需要动态密钥或加密即服务
# - 您管理跨多个服务的许多密钥
#
# 对于更简单的项目，请使用：
# - Kubernetes Secrets（基线）
# - SealedSecrets（可安全提交加密密钥）
# - 云提供商密钥管理器（AWS Secrets Manager、GCP Secret Manager）
#
# TODO: 实施步骤：
#
# 1. 通过 Helm 安装 Vault
# 2. 初始化和解封 Vault
# 3. 启用 Kubernetes 身份验证
# 4. 创建策略和角色
# 5. 在 Vault 中存储密钥
# 6. 安装 Secrets Store CSI Driver：
#    helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
#    helm install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver \
#      --namespace kube-system
# 7. 安装 Vault CSI Provider：
#    helm repo add hashicorp https://helm.releases.hashicorp.com
#    helm install vault-csi-provider hashicorp/vault-csi-provider \
#      --namespace vault
# 8. 创建 SecretProviderClass
# 9. 更新 Deployment 以使用 Vault 密钥
# 10. 测试密钥检索
#
# 参考资源：
# - Vault 文档：https://www.vaultproject.io/docs
# - Kubernetes 上的 Vault：https://www.vaultproject.io/docs/platform/k8s
# - CSI Driver：https://secrets-store-csi-driver.sigs.k8s.io/
