          # TODO: 显示 Docker 日志
          # docker logs ml-api
          echo "TODO: 显示日志"


  # ==========================================================================
  # 任务 6：完成后通知
  # ==========================================================================
  notify:
    name: 通知构建状态
    runs-on: ubuntu-latest
    needs: [code-quality, test, build, scan, integration-test]
    if: always()  # 即使前面的任务失败也运行

    steps:
      # TODO: 发送 Slack 通知
      # 使用 8398a7/action-slack@v3
      # 包含：工作流状态、分支、提交信息、作者
      - name: 发送 Slack 通知
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            CI 流水线：${{ job.status }}
            分支：${{ github.ref }}
            提交：${{ github.sha }}
            作者：${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()


