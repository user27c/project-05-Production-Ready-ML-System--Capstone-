name: CI 流水线

# TODO: 配置触发条件
# 此工作流应在以下情况下运行：
# - 每次推送到 main 和 develop 分支
# - 每次针对 main 和 develop 的拉取请求
# - 手动工作流分发（用于测试）

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# TODO: 设置环境变量
# 定义所有任务使用的全局环境变量
env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # 任务 1：代码质量检查
  # ==========================================================================
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest

    steps:
      # TODO: 检出代码
      # 使用 actions/checkout@v3 获取仓库代码
      - name: 检出代码
        uses: actions/checkout@v3

      # TODO: 设置 Python 环境
      # 使用 actions/setup-python@v4，版本从 env 获取
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # TODO: 缓存依赖
      # 使用 actions/cache 缓存 pip 依赖
      # Key: OS-python-version-requirements.txt 哈希
      - name: 缓存 Python 依赖
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # TODO: 安装代码检查工具
      # 安装：flake8、black、mypy、bandit
      - name: 安装代码检查工具
        run: |
          pip install flake8 black mypy bandit

      # TODO: 使用 flake8 进行代码检查
      # 在 src/ 目录运行 flake8
      # 最大行长度：120
      # 显示统计信息
      - name: 使用 flake8 检查代码
        run: |
          # TODO: 实现 flake8 命令
          # flake8 src/ --count --max-line-length=120 --statistics
          echo "TODO: 运行 flake8"

      # TODO: 使用 black 检查代码格式
      # 以检查模式运行 black（不修改文件）
      # 如果代码格式不正确应失败
      - name: 检查代码格式
        run: |
          # TODO: 实现 black 检查命令
          # black --check src/
          echo "TODO: 运行 black --check"

      # TODO: 使用 mypy 进行类型检查
      # 在 src/ 目录运行 mypy
      # 目前忽略缺失的导入
      - name: 类型检查
        run: |
          # TODO: 实现 mypy 命令
          # mypy src/ --ignore-missing-imports
          echo "TODO: 运行 mypy"

      # TODO: 使用 bandit 进行安全扫描
      # 扫描 src/ 的安全问题
      # 输出到 JSON 文件
      # 严重程度：medium 及以上
      - name: 安全扫描
        run: |
          # TODO: 实现 bandit 命令
          # bandit -r src/ -f json -o bandit-report.json
          echo "TODO: 运行 bandit"

      # TODO: 将安全报告上传为构件
      # 上传 bandit-report.json 供后续查看
      - name: 上传安全报告
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: bandit-report.json


  # ==========================================================================
  # 任务 2：单元测试和集成测试
  # ==========================================================================
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    needs: code-quality  # 仅在代码质量通过时运行

    steps:
      # TODO: 检出代码
      - name: 检出代码
        uses: actions/checkout@v3

      # TODO: 设置 Python
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # TODO: 安装依赖
      # 安装应用和测试依赖
      - name: 安装依赖
        run: |
          # TODO: 从 requirements.txt 安装
          # pip install -r requirements.txt
          # pip install pytest pytest-cov pytest-mock
          echo "TODO: 安装依赖"

      # TODO: 运行带覆盖率报告的单元测试
      # 使用 pytest 进行覆盖率报告
      # 最低覆盖率：80%
      # 生成 XML 和 HTML 报告
      - name: 运行单元测试
        run: |
          # TODO: 实现 pytest 命令
          # pytest tests/ --cov=src/ --cov-report=xml --cov-report=html --cov-fail-under=80
          echo "TODO: 运行 pytest"

      # TODO: 上传覆盖率报告到 Codecov
      # 使用 codecov/codecov-action@v3
      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      # TODO: 将覆盖率 HTML 报告上传为构件
      # 如有需要供手动查看
      - name: 上传覆盖率 HTML
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/


  # ==========================================================================
  # 任务 3：构建 Docker 镜像
  # ==========================================================================
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: test  # 仅在测试通过后构建

    steps:
      # TODO: 检出代码
      - name: 检出代码
        uses: actions/checkout@v3

      # TODO: 设置 Docker Buildx
      # 多平台构建和缓存必需
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v2

      # TODO: 登录容器仓库
      # 使用 GitHub 容器仓库（ghcr.io）
      # 凭据来自 GitHub secrets
      - name: 登录容器仓库
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TODO: 提取 Docker 元数据
      # 生成标签和标签
      # 标签：分支名、git SHA、PR 号
      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      # TODO: 构建并推送 Docker 镜像
      # 使用 docker/build-push-action@v4
      # 使用 GitHub Actions 缓存启用层缓存
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO: 保存镜像摘要供后续使用
      - name: 保存镜像摘要
        run: |
          echo "${{ steps.meta.outputs.tags }}" > image-tags.txt

      - name: 上传镜像标签
        uses: actions/upload-artifact@v3
        with:
          name: image-tags
          path: image-tags.txt


  # ==========================================================================
  # 任务 4：安全扫描
  # ==========================================================================
  scan:
    name: Docker 镜像安全扫描
    runs-on: ubuntu-latest
    needs: build  # 在镜像构建后运行

    steps:
      # TODO: 检出代码（Trivy 配置需要）
      - name: 检出代码
        uses: actions/checkout@v3

      # TODO: 从上一个任务下载镜像标签
      - name: 下载镜像标签
        uses: actions/download-artifact@v3
        with:
          name: image-tags

      # TODO: 获取镜像引用
      - name: 获取镜像引用
        id: image
        run: |
          IMAGE_TAG=$(head -n 1 image-tags.txt)
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      # TODO: 运行 Trivy 漏洞扫描器
      # 扫描构建的 Docker 镜像
      # 严重程度：CRITICAL、HIGH
      # 如果发现漏洞则退出代码为 1
      - name: 运行 Trivy 漏洞扫描器
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # TODO: 将 Trivy 结果上传到 GitHub Security
      - name: 将 Trivy 结果上传到 GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      # TODO: 生成人类可读的 Trivy 报告
      - name: 生成 Trivy 报告
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: 'table'
          output: 'trivy-report.txt'

      # TODO: 将 Trivy 报告上传为构件
      - name: 上传 Trivy 报告
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-report.txt


  # ==========================================================================
  # 任务 5：集成测试
  # ==========================================================================
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: build

    # TODO: 为集成测试设置服务
    # 示例：PostgreSQL、MinIO
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # TODO: 检出代码
      - name: 检出代码
        uses: actions/checkout@v3

      # TODO: 设置 Python
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # TODO: 安装依赖
      - name: 安装依赖
        run: |
          # TODO: 安装测试依赖
          echo "TODO: 安装依赖"

      # TODO: 下载镜像标签
      - name: 下载镜像标签
        uses: actions/download-artifact@v3
        with:
          name: image-tags

      # TODO: 使用构建的镜像启动 Docker 容器
      # 在后台运行容器
      # 暴露端口 5000
      # 设置环境变量
      - name: 启动应用容器
        run: |
          # TODO: 实现 docker run 命令
          # IMAGE_TAG=$(head -n 1 image-tags.txt)
          # docker run -d -p 5000:5000 \
          #   -e MLFLOW_TRACKING_URI=http://localhost:5000 \
          #   -e MODEL_NAME=test-model \
          #   -e API_KEYS=test-key \
          #   --name ml-api $IMAGE_TAG
          echo "TODO: 启动 Docker 容器"

      # TODO: 等待应用就绪
      - name: 等待应用启动
        run: |
          # TODO: 实现健康检查循环
          # for i in {1..30}; do
          #   if curl -f http://localhost:5000/health; then
          #     echo "应用已就绪"
          #     exit 0
          #   fi
          #   echo "等待应用启动..."
          #   sleep 2
          # done
          # echo "应用启动失败"
          # exit 1
          echo "TODO: 等待健康检查"

      # TODO: 运行集成测试
      # 端到端测试 API
      - name: 运行集成测试
        run: |
          # TODO: 运行集成测试套件
          # pytest tests/integration/ -v
          echo "TODO: 运行集成测试"

      # TODO: 失败时检查日志
      - name: 应用日志
        if: failure()
