# Kustomize Overlay - 生产环境
# ===========================================
# 此 overlay 自定义基础配置以适应生产部署。
# 生产环境需要最高的可靠性、安全性和性能标准。

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO: 引用基础配置
bases:
  - ../../base

# TODO: 添加生产环境特定标签
commonLabels:
  environment: production
  criticality: high

# TODO: 覆盖命名空间
namespace: ml-system-production

# TODO: 生产环境特定补丁
patchesStrategicMerge:
  # TODO: 添加生产环境补丁
  # - replica-count-patch.yaml
  # - resource-limits-patch.yaml
  # - ingress-patch.yaml
  # - monitoring-patch.yaml
  # - security-patch.yaml

# TODO: 设置生产环境副本数
replicas:
  # - name: ml-api-deployment
  #   count: 5  # 生产环境更高的基准

# TODO: 使用特定标签的生产环境镜像
# 生产环境中绝对不要使用 'latest' 标签！
images:
  # - name: ml-api
  #   newName: ghcr.io/your-org/ml-api
  #   newTag: v1.2.3  # 特定版本标签，绝对不要用 'latest'

# TODO: 生产环境 ConfigMap
configMapGenerator:
  - name: ml-model-config
    behavior: merge
    literals:
      # TODO: 添加生产环境配置
      # - MODEL_NAME=image-classifier
      # - MODEL_VERSION=production  # 或特定版本号
      # - MLFLOW_TRACKING_URI=https://mlflow.example.com
      # - LOG_LEVEL=WARN  # 生产环境减少日志输出
      # - ENVIRONMENT=production
      # - METRICS_ENABLED=true
      # - TRACING_ENABLED=true
      # - PERFORMANCE_MONITORING=true
      # - ENABLE_CACHE=true
      # - CACHE_TTL_SECONDS=3600

# TODO: 生产环境使用外部密钥管理
# 生产环境中不要使用 secretGenerator
# 使用 SealedSecrets、HashiCorp Vault、AWS Secrets Manager 等
# secretGenerator: []  # 空

# TODO: 添加生产环境特定资源
resources:
  # TODO: 添加生产环境资源
  # - ingress.yaml
  # - certificate.yaml
  # - sealed-secret.yaml
  # - pod-disruption-budget.yaml
  # - service-monitor.yaml  # 用于 Prometheus
  # - network-policy.yaml

# ==============================================================================
# 生产环境要求
# ==============================================================================

# 生产环境必须满足这些标准：
#
# 1. 高可用性：
#    ✅ 最少 5 个副本（高流量时更多）
#    ✅ HPA：最小 5，最大 20 个副本
#    ✅ Pod 中断预算：minAvailable = 3
#    ✅ 多可用区部署（跨 AZ 分布）
#    ✅ Pod 反亲和性（副本不共存）
#    ✅ 健康检查：存活探针、就绪探针、启动探针
#    ✅ 滚动更新策略：maxSurge=1，maxUnavailable=0
#
# 2. 安全性：
#    ✅ 使用有效生产证书的 TLS/HTTPS
#    ✅ 使用 Let's Encrypt 生产的 cert-manager
#    ✅ 强制执行网络策略
#    ✅ 基于最小权限的 RBAC
#    ✅ Pod 安全标准：restricted
#    ✅ 容器中使用非 root 用户
#    ✅ 只读根文件系统
#    ✅ 无特权容器
#    ✅ 从外部密钥管理器获取密钥
#    ✅ 镜像扫描和签名
#    ✅ API 身份验证和授权
#    ✅ 限流和 DDoS 防护
#
# 3. 性能：
#    ✅ 资源请求 = 限制（保证 QoS）
#    ✅ CPU：1000m 请求，2000m 限制
#    ✅ 内存：2Gi 请求，4Gi 限制
#    ✅ GPU 分配（如需要）
#    ✅ 用于模型缓存的本地 SSD
#    ✅ 优化的容器镜像（多阶段构建）
#    ✅ 模型量化和优化
#
# 4. 监控与可观测性：
#    ✅ 完整的 Prometheus/Grafana 栈
#    ✅ 带有 PagerDuty 集成的 Alertmanager
#    ✅ ELK 或 Loki 用于集中日志
#    ✅ 分布式追踪（Jaeger/Zipkin）
#    ✅ ServiceMonitor 自动抓取
#    ✅ SLO/SLI 追踪（99.9% 运行时间）
#    ✅ 错误预算监控
#    ✅ 性能仪表板
#
# 5. 可靠性：
#    ✅ 自动备份（每日）
#    ✅ 灾难恢复计划已测试
#    ✅ 回滚程序已文档化并测试
#    ✅ 外部依赖的熔断器
#    ✅ 指数退避的重试逻辑
#    ✅ 优雅降级（回退响应）
#    ✅ 连接池
#    ✅ 配置请求超时
#
# 6. 数据管理：
#    ✅ 有状态数据的持久卷
#    ✅ 启用卷快照
#    ✅ 备份保留：30 天
#    ✅ 跨区域备份复制
#    ✅ 静态数据加密
#    ✅ 传输中数据加密
#
# 7. 合规与治理：
#    ✅ 启用审计日志
#    ✅ 强制执行合规策略（PCI、HIPAA、GDPR）
#    ✅ 数据保留策略
#    ✅ 隐私控制
#    ✅ 定期安全审计
#    ✅ 漏洞扫描
#    ✅ 渗透测试
#
# ==============================================================================
# 学生实施
# ==============================================================================

