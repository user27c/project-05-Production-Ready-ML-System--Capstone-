# TODO: 部署前检查清单：
#
# 部署到生产环境之前：
#
# [ ] 所有测试在 staging 环境下通过
# [ ] 安全扫描通过（无严重/高危漏洞）
# [ ] 负载测试成功完成
# [ ] 灾难恢复计划已测试
# [ ] 回滚程序已测试
# [ ] 监控和告警已配置
# [ ] 值班轮次已安排
# [ ] Runbooks 已更新
# [ ] 变更请求已批准（如需要）
# [ ] 备份已验证
# [ ] 团队已通知部署时间窗口
# [ ] 冒烟测试已准备
#
# TODO: 部署程序：
#
# 1. 预览更改：
#    kubectl kustomize kubernetes/overlays/production/ | less
#
# 2. 备份当前生产环境：
#    kubectl get all -n ml-system-production -o yaml > backup-$(date +%Y%m%d-%H%M%S).yaml
#
# 3. 应用金丝雀部署（10% 流量）：
#    # 使用 CD 流水线（需要手动批准）
#
# 4. 监控金丝雀 10-15 分钟：
#    # 观察错误率、延迟、日志
#    # 如果发现问题，立即回滚
#
# 5. 升级到完全部署：
#    # 渐进式推出：10% → 25% → 50% → 100%
#    # 每一步都要监控
#
# 6. 验证部署：
#    kubectl get pods -n ml-system-production
#    kubectl rollout status deployment/ml-api -n ml-system-production
#
# 7. 运行冒烟测试：
#    curl https://api.example.com/health
#    # 运行完整测试套件
#
# 8. 监控 1 小时：
#    # 观察 Grafana 仪表板
#    # 检查错误率、延迟
#    # 审查日志中的错误
#
# 9. 宣布成功或回滚：
#    # 如果所有指标健康，部署成功
#    # 如果有问题，回滚并调查
#
# TODO: 回滚程序：
#
# 如果部署失败：
#
# 1. 立即回滚：
#    helm rollback ml-system -n ml-system-production
#    # 或：kubectl rollout undo deployment/ml-api -n ml-system-production
#
# 2. 验证回滚：
#    kubectl rollout status deployment/ml-api -n ml-system-production
#
# 3. 运行冒烟测试：
#    curl https://api.example.com/health
#
# 4. 告警团队：
#    # 通过 Slack/PagerDuty 通知
#    # 创建事件报告
#
# 5. 调查根本原因：
#    # 审查日志、指标
#    # 确定问题所在
#    # 规划下一次部署的修复
#
# TODO: 部署后：
#
# [ ] 监控指标 24 小时
# [ ] 检查是否有任何退化
# [ ] 更新文档
# [ ] 标记 Git 提交（例如：prod-v1.2.3）
# [ ] 更新 MLflow 模型注册表
# [ ] 编写部署总结
# [ ] 如有问题，安排事后分析
#
# ==============================================================================
# 生产环境最佳实践
# ==============================================================================

# 1. 绝不在周五部署（或长假前）
# 2. 生产部署总是需要两人参与
# 3. 在低流量时段部署
# 4. 在部署之前准备好回滚计划
# 5. 在部署期间和之后持续监控
# 6. 保持 staging 环境与生产环境一致
# 7. 定期测试灾难恢复（每季度）
# 8. 记录一切
# 9. 对风险更改使用功能开关
# 10. 绝不要跳过 staging - 即使是"小更改"
