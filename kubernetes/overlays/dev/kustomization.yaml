# ==============================================================================
# 开发环境特性
# ==============================================================================

# 开发 overlay 应配置：
#
# 1. 单副本：
#    - 为简单和资源效率仅使用 1 个 pod
#    - 开发环境不启用 HPA
#
# 2. 放宽的资源限制：
#    - 更低的 CPU/内存请求
#    - 允许更多资源用于调试
#
# 3. 调试日志：
#    - LOG_LEVEL=DEBUG
#    - 详细输出用于故障排除
#
# 4. 无 TLS：
#    - 仅使用 HTTP（不需要证书）
#    - 简化本地测试
#
# 5. 本地服务：
#    - 指向本地 MLflow、数据库
#    - 使用 localhost 或 minikube 服务 URL
#
# 6. 测试数据：
#    - 使用小型测试数据集
#    - 快速模型加载
#
# 7. 简化 Ingress：
#    - NodePort 或端口转发访问
#    - 不需要域名
#
# ==============================================================================
# 学生实施
# ==============================================================================

# TODO: 在此目录创建补丁文件：
#
# 1. replica-count-patch.yaml:
#    为开发环境减少副本数为 1
#
# 2. resource-limits-patch.yaml:
#    设置更低的资源请求/限制：
#    - CPU 请求：100m，限制：500m
#    - 内存请求：256Mi，限制：1Gi
#
# 3. ingress-patch.yaml（可选）：
#    配置本地访问的 ingress
#
# 测试此 overlay：
#   kubectl kustomize kubernetes/overlays/dev/
#
# 应用此 overlay：
#   kubectl apply -k kubernetes/overlays/dev/
#
# 访问服务：
#   kubectl port-forward -n ml-system-dev svc/ml-api 5000:80
#   curl http://localhost:5000/health
