# Kustomize 基础配置
# =============================
# 这是所有环境共享的基础配置。
# 环境特定的自定义通过 overlays 应用。

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO: 添加通用标签
# 此 kustomization 创建的所有资源都将具有这些标签
commonLabels:
  app.kubernetes.io/name: ml-api
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: ml-system

# TODO: 定义命名空间
# 所有资源将在此命名空间中创建
namespace: ml-system

# TODO: 列出基础资源
# 添加所有基础资源清单的路径
resources:
  # TODO: 添加资源文件
  # - namespace.yaml
  # - deployment.yaml
  # - service.yaml
  # - configmap.yaml
  # - secret.yaml  # 使用 SealedSecret 或外部密钥管理
  # - hpa.yaml
  # - pdb.yaml  # Pod 中断预算
  # - networkpolicy.yaml
  # - serviceaccount.yaml
  # - role.yaml
  # - rolebinding.yaml

# TODO: 配置 ConfigMap 生成器
# 从文件或字面量生成 ConfigMaps
configMapGenerator:
  # 示例：
  # - name: ml-model-config
  #   literals:
  #     - MODEL_NAME=image-classifier
  #     - MODEL_VERSION=latest
  #     - MLFLOW_TRACKING_URI=http://mlflow-server:5000
