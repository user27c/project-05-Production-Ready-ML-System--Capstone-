# TODO: 配置 Secret 生成器
# 生成 Secrets（仅用于开发 - 生产环境使用 Sealed Secrets）
secretGenerator:
  # 示例：
  # - name: api-keys
  #   literals:
  #     - API_KEY=dev-api-key-change-in-production

# TODO: 添加通用注解
# 这些注解将被添加到所有资源
commonAnnotations:
  # 示例：
  # managed-by: kustomize
  # version: "1.0"

# TODO: 定义镜像
# 指定要使用的容器镜像
images:
  # 示例：
